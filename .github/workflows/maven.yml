name: GitHub Action CI build

on:
  push:
#    branches-ignore:
#      - dependabot/**
  pull_request:

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [17, 21, 25]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use artifact caching
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -X -e -B -V -ntp clean verify

      - name: Set up jBang
        if: runner.os == 'Linux' && matrix.java == 21
        uses: jbangdev/setup-jbang@v0.1.1

      - name: Smoke-test the jBang catalog (issue 94)
        if: runner.os == 'Linux' && matrix.java == 21
        shell: bash
        run: >-
          jbang run --java-options=-Djava.awt.headless=true
          --cp target/test-classes
          --main 'de.aikiit.spamprotector.ExecutableJarIT$Probe'
          spamschutz

      - name: Code coverage with codecov
        uses: codecov/codecov-action@v7
